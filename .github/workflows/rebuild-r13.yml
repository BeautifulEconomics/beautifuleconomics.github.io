name: rebuild-r13
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_applyB.py
      - run: python3 scripts/fetch_papers.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_dB.txt scripts/_applyB.py .github/workflows/rebuild-r13.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "AER and Econometrica research feed, social links, trust footer, bolder nav"
          git push
