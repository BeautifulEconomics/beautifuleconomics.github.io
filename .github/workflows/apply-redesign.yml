name: Apply redesign

# A one-off helper: unpacks scripts/_redesign_*.txt over the site files and
# commits the result. Run it by hand from the Actions tab. Once the redesign
# has landed, this workflow, the script and the two bundle files can all be
# deleted - nothing else refers to them.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack the redesign
        run: python scripts/apply_redesign.py

      - name: Commit the result
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "beautiful-economics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply the redesign: new type, centred cover, plate-framed chart"
          git push
