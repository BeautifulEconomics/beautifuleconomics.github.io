name: rebuild-r39
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_applyA2.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_dA2.txt scripts/_applyA2.py .github/workflows/rebuild-r39.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Guides becomes Shop: a place for work that will be sold"
          git push
