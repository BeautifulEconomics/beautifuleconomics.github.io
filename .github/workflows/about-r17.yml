name: about-r17
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_about17.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_about17.py .github/workflows/about-r17.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Repair the empty contact link on About, and list Advanced there"
          git push
