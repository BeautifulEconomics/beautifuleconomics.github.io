name: research
on:
  schedule:
    - cron: "20 4 * * 1"   # Monday mornings, 09:50 India time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_papers.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/papers.yml
          if git diff --cached --quiet -- _data/papers.yml; then echo "unchanged"; exit 0; fi
          git commit -m "Refresh newly published research"
          git push
