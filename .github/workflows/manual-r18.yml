name: manual-r18
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_applyF.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_dF.txt scripts/_applyF.py .github/workflows/manual-r18.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace the old setup notes with a working manual, and create the library folder"
          git push
