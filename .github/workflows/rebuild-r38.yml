name: rebuild-r38
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_applyZ.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_dZ.txt scripts/_applyZ.py .github/workflows/rebuild-r38.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Study guides page; fix default-blue links outside prose"
          git push
