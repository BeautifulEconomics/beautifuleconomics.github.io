name: rebuild-r10
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_apply9.py
      - run: python3 scripts/fetch_news.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_d9.txt scripts/_apply9.py .github/workflows/rebuild-r10.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Daily word made prominent, headlines replace India-only data, one FAQ"
          git push
