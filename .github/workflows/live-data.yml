name: Update live economic data

# Runs on its own every weekday morning, fetches fresh numbers and commits
# them. Committing to main makes GitHub Pages rebuild the site, so the
# homepage shows the new figures a minute or so later.
#
# You can also run it by hand: Actions tab -> this workflow -> Run workflow.

on:
  schedule:
    # 04:10 UTC = 09:40 IST, weekdays only. The European Central Bank
    # publishes its reference rates around 16:00 CET the previous day, so
    # by this time there is always a fresh figure to fetch.
    - cron: "10 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the data
        run: python scripts/fetch_live_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- _data/live.yml; then
            echo "Numbers are unchanged today. Nothing to commit."
            exit 0
          fi
          git config user.name  "beautiful-economics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/live.yml
          git commit -m "Update live data ($(date -u +%Y-%m-%d))"
          git push
