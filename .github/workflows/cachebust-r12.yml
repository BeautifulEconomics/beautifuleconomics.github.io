name: cachebust-r12
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_head12.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_head12.py .github/workflows/cachebust-r12.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Stamp build time on the stylesheet so design changes reach readers at once"
          git push
