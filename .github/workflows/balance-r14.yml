name: balance-r14
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_bal14.py
      - run: python3 scripts/fetch_papers.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_bal14.py .github/workflows/balance-r14.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Give each journal a share of the research list"
          git push
