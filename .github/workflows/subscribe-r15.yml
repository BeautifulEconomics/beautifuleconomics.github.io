name: subscribe-r15
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_sub15.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_sub15.py .github/workflows/subscribe-r15.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Show the keep-in-touch section on every page"
          git push
