name: rebuild-r37
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_applyY.py
      - name: remove scaffolding
        run: git rm -q --ignore-unmatch scripts/_dY.txt scripts/_applyY.py .github/workflows/rebuild-r37.yml .github/workflows/rebuild-r10.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Advanced: the Phillips curve; fix unrendered maths on all advanced pages"
          git push
