name: patch-r4
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/_p4unpack.py
      - run: python3 scripts/_p4run.py
      - run: git rm -q scripts/_p4.txt scripts/_p4unpack.py scripts/_p4run.py .github/workflows/patch-r4.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hide newsletter until configured, add YouTube, drop dead contact address"
          git push
