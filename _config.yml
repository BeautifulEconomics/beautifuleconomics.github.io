# ---------------------------------------------------------------
# Beautiful Economics - site settings
# Change the values here, commit, and the whole site updates.
# After editing this file it can take ~1 minute for GitHub to rebuild.
# ---------------------------------------------------------------

title: Beautiful Economics
tagline: Economics, explained plainly and kept where you can find it again.
description: >-
  Clear, careful writing about economics - the ideas, the evidence,
  and the arguments - by Arjun Sharma.
author: Arjun Sharma

# Your live address. No trailing slash.
url: "https://beautifuleconomics.in"
baseurl: ""

# Where people can find you. Leave a value empty ("") to hide that link.
# Paste the full address from your browser's address bar, not just the name.
facebook: ""
instagram: ""
youtube: ""
whatsapp_channel: ""
twitter: ""
# Leave empty until the address really receives mail. An address that
# bounces silently is worse than none: corrections never reach you.
email: ""

# Selling, for when you are ready. Leave empty and nothing appears.
# A static site cannot take payments itself, so these point at a shop that
# can. Gumroad, Payhip or Lemon Squeezy all sell a PDF from a plain link;
# a paid newsletter (Substack, Ghost, Buttondown) handles subscriptions.
shop: ""            # link to your shop or book page
shop_label: "Books" # the words shown on the link

# Newsletter. Paste the form action URL from your email provider here.
# Buttondown:  https://buttondown.email/api/emails/embed-subscribe/YOURNAME
# MailerLite / Substack: see README.md
newsletter_action: ""
newsletter_field: "email"
# --- Build settings. You will not normally need to touch these. ---
markdown: kramdown
permalink: /:title/
timezone: Asia/Kolkata
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor

collections:
  concepts:
    output: true
    permalink: /concepts/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "concepts"
    values:
      layout: "concept"
