# Word of the day. Rotates on its own, every day.
# To add one: - term: "Name"
#               meaning: "One line. Short words. No jargon inside the definition."
#               link: "slug-of-a-concept-page"   # optional

- term: "Opportunity cost"
  meaning: "The best thing you gave up in order to get the thing you chose."
  link: "opportunity-cost"
- term: "Scarcity"
  meaning: "There is never enough of everything for everyone, so something must always be chosen over something else."
- term: "Inflation"
  meaning: "Money slowly buying less than it used to."
- term: "Deflation"
  meaning: "Prices falling — which sounds good until people stop buying and wait for them to fall further."
- term: "Demand"
  meaning: "How much of something people will actually buy at a given price."
- term: "Supply"
  meaning: "How much of something sellers are willing to offer at a given price."
- term: "Equilibrium"
  meaning: "The price at which what sellers offer and what buyers want finally match."
- term: "Elasticity"
  meaning: "How much people change what they buy when the price moves."
- term: "Comparative advantage"
  meaning: "Two sides both gain from trading, even when one of them is better at everything."
  link: "comparative-advantage"
- term: "Absolute advantage"
  meaning: "Simply being able to make something using fewer resources than someone else can."
- term: "Moral hazard"
  meaning: "Being protected from a risk quietly changes how carefully you behave around it."
  link: "moral-hazard"
- term: "Adverse selection"
  meaning: "The people most likely to make a claim are the keenest to buy the insurance."
- term: "Externality"
  meaning: "A cost or a benefit that lands on someone who was never part of the deal."
- term: "Public good"
  meaning: "Something everyone can use and nobody can be shut out of, like a street light."
- term: "Free rider"
  meaning: "Someone who enjoys what other people paid for without paying anything."
- term: "Tragedy of the commons"
  meaning: "Everyone takes a little more from a shared resource until there is nothing left for anyone."
- term: "Marginal cost"
  meaning: "What it costs to make just one more."
- term: "Diminishing returns"
  meaning: "Each extra bit of effort adds a little less than the bit before it."
- term: "Sunk cost"
  meaning: "Money already spent and gone, which should play no part in what you decide next."
- term: "GDP"
  meaning: "The total value of everything a country produces in a year."
- term: "GDP per capita"
  meaning: "A country's output divided by its population — a rough guide to average income."
- term: "Real and nominal"
  meaning: "Nominal is the raw number; real is the same number after inflation has been stripped out."
- term: "Recession"
  meaning: "The economy shrinking for long enough that jobs start to disappear."
- term: "Unemployment rate"
  meaning: "The share of people who want paid work and cannot find any."
- term: "Interest rate"
  meaning: "The price of borrowing money, and the reward for lending it."
- term: "Compound interest"
  meaning: "Interest that earns interest — which is why small savings grow surprisingly fast over decades."
- term: "Central bank"
  meaning: "The institution that sets a country's interest rate and looks after its money."
- term: "Monetary policy"
  meaning: "Steering the economy by changing how expensive it is to borrow."
- term: "Fiscal policy"
  meaning: "Steering the economy through government spending and taxation."
- term: "Budget deficit"
  meaning: "A government spending more in a year than it collects."
- term: "National debt"
  meaning: "Everything a government still owes from all the deficits it has run before."
- term: "Exchange rate"
  meaning: "How much of one country's money another country's money will buy."
- term: "Devaluation"
  meaning: "Deliberately making your own currency cheaper so that exports sell better abroad."
- term: "Purchasing power parity"
  meaning: "Comparing countries by what money actually buys there, rather than by the exchange rate."
- term: "Balance of trade"
  meaning: "The gap between what a country sells abroad and what it buys from abroad."
- term: "Tariff"
  meaning: "A tax on imports, paid in the end by the people who buy them."
- term: "Subsidy"
  meaning: "Government money that makes something cheaper to buy than it was to make."
- term: "Monopoly"
  meaning: "One seller with no real competition, and therefore free to set the price."
- term: "Oligopoly"
  meaning: "A handful of firms large enough that each one watches what the others do."
- term: "Cartel"
  meaning: "Rival firms quietly agreeing not to compete — usually illegal, often hard to prove."
- term: "Price discrimination"
  meaning: "Charging different people different prices for exactly the same thing."
- term: "Barrier to entry"
  meaning: "Anything that makes it hard for a new competitor to get started."
- term: "Creative destruction"
  meaning: "New ways of doing things killing off the old ones, along with the jobs inside them."
- term: "Productivity"
  meaning: "How much gets produced for each hour of work."
- term: "Human capital"
  meaning: "The skills and knowledge inside people, which earn a return much like any other investment."
- term: "Rent seeking"
  meaning: "Getting richer by taking a bigger slice rather than by baking a bigger cake."
- term: "Deadweight loss"
  meaning: "Value that simply vanishes — nobody gets it — because a market was distorted."
- term: "Game theory"
  meaning: "The study of choices where the right move depends on what everyone else does."
- term: "Prisoner's dilemma"
  meaning: "Two people each act sensibly and both end up worse off than if they had trusted each other."
- term: "Nash equilibrium"
  meaning: "A situation where nobody can do better by changing their own move alone."
- term: "Zero-sum"
  meaning: "A situation where one side can only gain exactly what the other side loses."
- term: "Information asymmetry"
  meaning: "One side of a deal knows much more than the other."
- term: "Signalling"
  meaning: "Doing something deliberately costly purely to prove something about yourself."
- term: "Principal-agent problem"
  meaning: "You hire someone to act for you, and their interests are not quite the same as yours."
- term: "Behavioural economics"
  meaning: "The study of how people actually decide, rather than how the theory says they should."
- term: "Loss aversion"
  meaning: "Losing a hundred hurts more than gaining a hundred pleases."
- term: "Anchoring"
  meaning: "The first number you hear quietly shapes every number you think of afterwards."
- term: "Nudge"
  meaning: "Changing how a choice is presented without taking any option away."
- term: "Bounded rationality"
  meaning: "People decide sensibly, but with limited time, limited information and limited attention."
- term: "Gini coefficient"
  meaning: "A single number, from zero to one, showing how unequally income is shared."
- term: "Poverty line"
  meaning: "The income below which a person cannot cover basic needs."
- term: "Progressive tax"
  meaning: "A tax that takes a larger share from larger incomes."
- term: "Regressive tax"
  meaning: "A tax that takes a larger share from smaller incomes."
- term: "Velocity of money"
  meaning: "How often the same unit of money changes hands over a year."
- term: "Liquidity"
  meaning: "How quickly something can be turned into cash without losing much of its value."
- term: "Bubble"
  meaning: "Prices rising mainly because people expect them to keep rising — until they stop."
- term: "Hyperinflation"
  meaning: "Prices rising so fast that money stops working as money."
- term: "Stagflation"
  meaning: "Prices rising while the economy stalls — the combination nobody has a clean fix for."
- term: "Economies of scale"
  meaning: "Making more of something makes each one cheaper to make."
- term: "Network effect"
  meaning: "Something becomes more useful the more people are already using it."
- term: "Switching cost"
  meaning: "What it would cost you to move to a rival, which is often why you do not."
- term: "Consumer price index"
  meaning: "A fixed basket of everyday goods, priced again and again, to measure inflation."
- term: "Remittance"
  meaning: "Money sent home by someone working in another country."
- term: "Informal economy"
  meaning: "Work that is entirely real but unregistered, untaxed and uncounted."
- term: "Capital"
  meaning: "The tools, machines and buildings used to produce other things."
- term: "Marginal utility"
  meaning: "The extra satisfaction from one more of something — usually smaller each time."
- term: "Transaction cost"
  meaning: "What it costs to make a deal happen at all: finding, checking, haggling, enforcing."
- term: "Crowding out"
  meaning: "Government borrowing pushing up interest rates until private borrowers step back."
- term: "Real wage"
  meaning: "What your pay actually buys, rather than what the number on it says."
- term: "Terms of trade"
  meaning: "The price of what a country sells compared with the price of what it buys."
