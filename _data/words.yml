# ---------------------------------------------------------------
# Word of the day.
#
# One term is shown each day, picked by the date, so every reader
# anywhere sees the same word on the same day. Nothing to run and
# nothing to schedule: add entries and the rotation takes care of
# itself.
#
# 500 terms. The list is ordered so that no two consecutive days
# come from the same branch of economics. If you add entries, add
# them at the end; the alternation only matters for the order as
# it stands.
#
# COPY THIS SHAPE. Two spaces before every line after the first.
#
#   - term: "Comparative advantage"
#     meaning: "One line. Short words. No jargon inside the definition."
#     field: "Microeconomics"
#     link: "slug-of-a-concept-page"   # optional, only if that page exists
#
# field  is a note for you; it is not shown on the site.
# link   turns the term into a link. Only add it when a page with
#        that exact filename already exists in _concepts/.
# ---------------------------------------------------------------

