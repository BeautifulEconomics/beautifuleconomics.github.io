# ---------------------------------------------------------------
# The Shop page.
#
# This file is empty on purpose. While it has no entries, the whole
# "What is being made" section is hidden and the Shop page shows only
# the message that something is coming. Add one entry below and the
# section appears on its own.
#
# Everything you decide to sell goes here: a concept written out in
# full, a PDF, a book, a set of handwritten pages. Nothing is for sale
# until its status is "ready" AND it has a link, so an unfinished piece
# can never take someone's money by accident.
#
# COPY THIS SHAPE. Remove the # from the start of each line, and keep
# two spaces before every line after the first.
#
#   - title: "Consumer theory, start to finish"
#     topic: "Microeconomics"
#     status: "writing"
#     note: "One sentence on what it is and who it is for."
#
# status  must be one of:
#   planned  - decided on, not started     -> shows "Planned"
#   writing  - being made now              -> shows "Being written"
#   editing  - done, being checked         -> shows "Nearly ready"
#   ready    - finished and on sale        -> shows the price and a button
#
# For a "ready" item add two more lines:
#     price: "₹49"
#     link: "https://..."     (wherever people pay - Gumroad, Payhip, Razorpay)
#
# Keep this list honest. An item that has sat at "writing" for six months
# tells a reader more than any promise on the page does.
# ---------------------------------------------------------------
