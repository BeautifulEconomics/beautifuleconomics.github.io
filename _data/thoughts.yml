  what: "physician"
  source: "On the Motion of the Heart and Blood, 1628"
- text: "Socrates held that the unexamined life is not worth living, and died rather than stop asking his questions."
  who: "Socrates"
  what: "philosopher"
  source: "Plato's Apology, c. 399 BCE"
- text: "Akbar convened debates between scholars of different religions and pursued a policy of universal peace between faiths."
  who: "Abul Fazl"
  what: "chronicler"
  source: "Akbarnama, 1590s"
- text: "Levinas argued that ethics begins with the face of another person, which makes a claim on you before you have reasoned about it."
  who: "Emmanuel Levinas"
  what: "philosopher"
  source: "Totality and Infinity, 1961"
- text: "Raymond contrasted the cathedral, built in private by a few, with the bazaar of open development, and argued that many eyes make bugs shallow."
  who: "Eric S. Raymond"
  what: "programmer"
  source: "The Cathedral and the Bazaar, 1997"
- text: "Verghese Kurien built a dairy cooperative that made producers the owners, turning India from a milk importer into the world's largest producer."
  who: "Verghese Kurien"
  what: "engineer and cooperative leader"
  source: "I Too Had a Dream, 2005"
- text: "Kahneman and Tversky found that people weigh losses more heavily than equivalent gains, and judge outcomes from a reference point rather than in absolute terms."
  who: "Daniel Kahneman and Amos Tversky"
  what: "psychologists"
  source: "Prospect Theory, 1979"
- text: "Oppenheimer argued after the bomb that physicists had known sin, and spent his later years arguing for international control."
  who: "J. Robert Oppenheimer"
  what: "physicist"
  source: "MIT lecture, 1947"
- text: "Mintzberg found that managers do not spend their days planning and controlling but in brief, fragmented, mostly verbal interruptions."
  who: "Henry Mintzberg"
  what: "management scholar"
  source: "The Nature of Managerial Work, 1973"
- text: "We get our dinner not because the butcher and the baker are kind, but because selling it serves them too. Smith's point was not that kindness is useless — it is that a system working only on kindness would feed almost nobody."
  who: "Adam Smith"
  what: "economist"
  source: "The Wealth of Nations, 1776"
- text: "Aurobindo argued that political freedom without an inner transformation would leave the same habits under a new flag."
  who: "Sri Aurobindo"
  what: "philosopher"
  source: "The Human Cycle, 1916"
- text: "Orwell observed that in a time of deceit, telling the truth becomes a radical act, and spent his career testing the claim."
  who: "George Orwell"
  what: "writer"
  source: "Essays, 1940s"
- text: "Robbins defined economics not by its subject but by its problem: the allocation of scarce means that have alternative uses. On that definition, almost any choice becomes economic."
  who: "Lionel Robbins"
  what: "economist"
  source: "An Essay on the Nature and Significance of Economic Science, 1932"
- text: "Jane Goodall observed chimpanzees making and using tools, which forced a redefinition of what had been thought uniquely human."
  who: "Jane Goodall"
  what: "primatologist"
  source: "Tool-Using and Aimed Throwing in Chimpanzees, 1964"
- text: "Taiichi Ohno built a production system around stopping the line when something is wrong, making problems visible instead of hiding them."
  who: "Taiichi Ohno"
  what: "engineer"
  source: "Toyota Production System, 1978"
- text: "Loftus showed that memory is reconstructed rather than replayed, and that the wording of a question can change what a witness recalls."
  who: "Elizabeth Loftus"
  what: "psychologist"
  source: "Reconstruction of Automobile Destruction, 1974"
- text: "Hardin argued that a pasture open to all would be destroyed because each herdsman gains the whole value of an extra animal while sharing the cost of overgrazing."
  who: "Garrett Hardin"
  what: "ecologist"
  source: "The Tragedy of the Commons, 1968"
- text: "Freire argued against education as deposits made into passive students, and for teaching that treats learners as thinkers."
  who: "Paulo Freire"
  what: "educator"
  source: "Pedagogy of the Oppressed, 1968"
- text: "Sen's work on missing women showed that sex ratios in parts of Asia implied tens of millions of women who should have been alive and were not."
  who: "Amartya Sen"
  what: "economist"
  source: "More Than 100 Million Women Are Missing, 1990"
- text: "Meadows argued that the most powerful place to intervene in a system is the mindset out of which its goals and rules arise."
  who: "Donella Meadows"
  what: "systems thinker"
  source: "Leverage Points, 1999"
- text: "Kepler abandoned the circle for the ellipse only after years of failing to fit Mars, and published the failures alongside the result."
  who: "Johannes Kepler"
  what: "astronomer"
  source: "Astronomia Nova, 1609"
- text: "Heraclitus held that you cannot step into the same river twice, because neither the river nor you stay the same."
  who: "Heraclitus"
  what: "philosopher"
  source: "Fragments, c. 500 BCE"
- text: "Asch found that people will deny the evidence of their own eyes about the length of a line if enough others around them do."
  who: "Solomon Asch"
  what: "psychologist"
  source: "Opinions and Social Pressure, 1955"
- text: "Thucydides reported the Athenians telling the Melians that the strong do what they can and the weak suffer what they must."
  who: "Thucydides"
  what: "historian"
  source: "History of the Peloponnesian War, c. 400 BCE"
- text: "Lister introduced antiseptic surgery and cut death rates sharply, against colleagues who found the idea of invisible germs absurd."
  who: "Joseph Lister"
  what: "surgeon"
  source: "On the Antiseptic Principle in the Practice of Surgery, 1867"
- text: "Hugo argued that a society that creates misery and then punishes it has misunderstood where the crime began."
  who: "Victor Hugo"
  what: "novelist"
  source: "Les Misérables, 1862"
- text: "Weizenbaum built a simple chatbot, watched people confide in it, and spent the rest of his life warning about what we attribute to machines."
  who: "Joseph Weizenbaum"
  what: "computer scientist"
  source: "Computer Power and Human Reason, 1976"
- text: "Bayes gave a rule for revising a probability when new evidence arrives, published only after his death."
  who: "Thomas Bayes"
  what: "mathematician"
  source: "An Essay towards Solving a Problem in the Doctrine of Chances, 1763"
- text: "Von Neumann and Morgenstern founded game theory as a discipline, arguing that economic behaviour in small groups is strategic rather than parametric."
  who: "John von Neumann and Oskar Morgenstern"
  what: "mathematician and economist"
  source: "Theory of Games and Economic Behavior, 1944"
- text: "Grace Hopper argued that programs should be written in words rather than machine codes, and built the compiler that made it possible."
  who: "Grace Hopper"
  what: "computer scientist"
  source: "The Education of a Computer, 1952"
- text: "Machiavelli argued that a ruler should study how people actually behave rather than how they ought to, however unpleasant the conclusion."
  who: "Niccolò Machiavelli"
  what: "political theorist"
  source: "The Prince, 1532"
- text: "Vandana Shiva argued that seed saved and exchanged by farmers is a commons, and that turning it into property changes who controls food."
  who: "Vandana Shiva"
  what: "environmental thinker"
  source: "The Violence of the Green Revolution, 1991"
- text: "Mendel discovered that inheritance works in discrete units rather than by blending, and his paper sat unread for thirty-five years."
  who: "Gregor Mendel"
  what: "monk and scientist"
  source: "Experiments on Plant Hybridization, 1866"
- text: "Csikszentmihalyi described flow: complete absorption in a task difficult enough to demand everything you have and no more."
  who: "Mihaly Csikszentmihalyi"
  what: "psychologist"
  source: "Flow, 1990"
- text: "Henrietta Lacks's cells, taken without her knowledge, became the most widely used human cell line in medicine."
  who: "Rebecca Skloot"
  what: "writer"
  source: "The Immortal Life of Henrietta Lacks, 2010"
- text: "Aristotle placed most virtues between two vices — courage between cowardice and recklessness, generosity between meanness and waste."
  who: "Aristotle"
  what: "philosopher"
  source: "Nicomachean Ethics, c. 340 BCE"
