# ---------------------------------------------------------------
# Thought of the day.
#
# One is shown each day, picked by the date. Nothing to schedule.
#
# These are IDEAS RESTATED IN PLAIN LANGUAGE, not quotations.
# That is deliberate. A misattributed quote is the fastest way an
# economics page loses its reputation, and Smith and Keynes are the
# two most misquoted economists there have ever been. Describing
# what someone argued, and naming the work, cannot be a misquote.
#
# AN ENTRY WITH NO source: IS SILENTLY DROPPED. You cannot
# accidentally publish an unsourced claim under your own name.
#
# COPY THIS SHAPE. Two spaces before every line after the first.
#
#   - text: "The idea, in plain language. Two or three sentences."
#     who: "Elinor Ostrom"
#     what: "political economist"
#     source: "Governing the Commons, 1990"
# ---------------------------------------------------------------

- text: "Spence, Akerlof and Stiglitz together established that information is rarely shared equally between the two sides of a transaction, and that this changes almost everything."
  who: "George Akerlof, Michael Spence and Joseph Stiglitz"
  what: "economists"
  source: "Nobel Prize lectures, 2001"
- text: "Marcus Aurelius reminded himself each morning that he would meet the ungrateful and the arrogant, and that being surprised by it was his own failure."
  who: "Marcus Aurelius"
  what: "emperor and philosopher"
  source: "Meditations, c. 180"
- text: "Deaton warned that aid can weaken the link between a government and its citizens, because a state funded from abroad needs its people less."
  who: "Angus Deaton"
  what: "economist"
  source: "The Great Escape, 2013"
- text: "Hubble found that distant galaxies are moving away from us faster the further off they are, which implied an expanding universe."
  who: "Edwin Hubble"
  what: "astronomer"
  source: "A Relation Between Distance and Radial Velocity, 1929"
- text: "Simpson's paradox is the discovery that a pattern can hold within every group and reverse when the groups are added together. Aggregation can lie."
  who: "Edward Simpson"
  what: "statistician"
  source: "The Interpretation of Interaction in Contingency Tables, 1951"
- text: "Heisenberg showed that position and momentum cannot both be known precisely: the limit is in nature, not in our instruments."
  who: "Werner Heisenberg"
  what: "physicist"
  source: "On the Perceptual Content of Quantum Theoretical Kinematics, 1927"
- text: "Marx saw capitalism as revolutionary rather than static: it constantly tears up its own methods, relations and certainties. Even his critics borrowed the observation."
  who: "Karl Marx"
  what: "economist and philosopher"
  source: "The Communist Manifesto, 1848"
- text: "Kant insisted that people must be treated as ends in themselves and never merely as means to someone else's purpose."
  who: "Immanuel Kant"
  what: "philosopher"
  source: "Groundwork of the Metaphysics of Morals, 1785"
- text: "Güth and colleagues found that people reject unfair offers of free money, choosing nothing over an insulting share. Fairness is costly and real."
  who: "Werner Güth and colleagues"
  what: "economists"
  source: "An Experimental Analysis of Ultimatum Bargaining, 1982"
- text: "Parfit argued that personal identity matters less than we think, and that what we actually care about is psychological continuity."
  who: "Derek Parfit"
  what: "philosopher"
  source: "Reasons and Persons, 1984"
- text: "Sen argued that development should be judged by what people are actually able to do and be, not by the income they hold."
  who: "Amartya Sen"
  what: "economist"
  source: "Development as Freedom, 1999"
- text: "Semmelweis found that doctors washing their hands between the morgue and the delivery ward saved lives, and was rejected by his profession for saying so."
  who: "Ignaz Semmelweis"
  what: "physician"
  source: "The Etiology of Childbed Fever, 1861"
- text: "Stiglitz and Rothschild showed that insurers who cannot tell safe customers from risky ones may offer deliberately limited cover, so that customers sort themselves."
  who: "Joseph Stiglitz and Michael Rothschild"
  what: "economists"
  source: "Equilibrium in Competitive Insurance Markets, 1976"
- text: "Einstein held that imagination is more important than knowledge, because knowledge is limited to what we already have."
  who: "Albert Einstein"
  what: "physicist"
  source: "Interview in The Saturday Evening Post, 1929"
- text: "Krugman explained why similar countries trade so much with each other: increasing returns and consumers who like variety, not differences in what each is good at."
  who: "Paul Krugman"
  what: "economist"
  source: "Increasing Returns, Monopolistic Competition, and International Trade, 1979"
- text: "Nietzsche argued that a person who has a why to live can bear almost any how."
  who: "Friedrich Nietzsche"
  what: "philosopher"
  source: "Twilight of the Idols, 1889"
- text: "Card and Krueger compared fast-food restaurants across a state border after one side raised its minimum wage, and found no job losses where theory predicted them."
  who: "David Card and Alan Krueger"
  what: "economists"
  source: "Minimum Wages and Employment, 1994"
- text: "Locke argued that government holds its authority on trust from the governed, and forfeits it when it works against them."
  who: "John Locke"
  what: "philosopher"
  source: "Two Treatises of Government, 1689"
- text: "Illich argued that beyond a point, institutions begin to defeat their own purposes: schools can obstruct learning and medicine can produce illness."
  who: "Ivan Illich"
  what: "social critic"
  source: "Tools for Conviviality, 1973"
- text: "Gould argued that intelligence testing has repeatedly been used to dress up prejudice as measurement."
  who: "Stephen Jay Gould"
  what: "palaeontologist"
  source: "The Mismeasure of Man, 1981"
- text: "Mill argued that the laws of production are fixed by nature, but the laws of distribution are made by people. How output is shared is a choice a society makes, not a fact it discovers."
  who: "John Stuart Mill"
  what: "philosopher and economist"
  source: "Principles of Political Economy, 1848"
- text: "Bacon argued that knowledge should be built from careful observation upward, not deduced from ancient texts downward."
  who: "Francis Bacon"
  what: "philosopher of science"
  source: "Novum Organum, 1620"
- text: "Kuhn argued that science does not advance by steady accumulation but through long settled periods broken by revolutions that change the questions themselves."
  who: "Thomas Kuhn"
  what: "historian of science"
  source: "The Structure of Scientific Revolutions, 1962"
- text: "Granovetter found that people hear about jobs more often from acquaintances than close friends, because weak ties reach further."
  who: "Mark Granovetter"
  what: "sociologist"
  source: "The Strength of Weak Ties, 1973"
- text: "Gneezy and Rustichini found that a fine for collecting children late from nursery increased lateness: the fine turned a social obligation into a priced service."
  who: "Uri Gneezy and Aldo Rustichini"
  what: "economists"
  source: "A Fine is a Price, 2000"
- text: "William James argued that in many situations belief helps create the fact, so waiting for certainty before acting can guarantee failure."
  who: "William James"
  what: "philosopher and psychologist"
  source: "The Will to Believe, 1896"
- text: "Rawls proposed judging a society's rules from behind a veil of ignorance, not knowing which position in it you would occupy."
  who: "John Rawls"
  what: "philosopher"
  source: "A Theory of Justice, 1971"
- text: "Weber argued that the modern state is defined by its monopoly on the legitimate use of force within a territory."
  who: "Max Weber"
  what: "sociologist"
  source: "Politics as a Vocation, 1919"
- text: "Meehl found that simple statistical rules outperformed expert clinical judgement in prediction, a result that has survived decades of attempts to overturn it."
  who: "Paul Meehl"
  what: "psychologist"
  source: "Clinical versus Statistical Prediction, 1954"
- text: "Aristotle placed most virtues between two vices — courage between cowardice and recklessness, generosity between meanness and waste."
  who: "Aristotle"
  what: "philosopher"
  source: "Nicomachean Ethics, c. 340 BCE"
- text: "Von Neumann and Morgenstern founded game theory as a discipline, arguing that economic behaviour in small groups is strategic rather than parametric."
  who: "John von Neumann and Oskar Morgenstern"
  what: "mathematician and economist"
  source: "Theory of Games and Economic Behavior, 1944"
- text: "Pasteur observed that in the field of observation, chance favours only the prepared mind."
  who: "Louis Pasteur"
  what: "chemist"
  source: "Lecture at the University of Lille, 1854"
- text: "Becker extended economic reasoning to crime, marriage and family, arguing that people respond to incentives in those domains as in any other."
  who: "Gary Becker"
  what: "economist"
  source: "The Economic Approach to Human Behavior, 1976"
- text: "Sartre argued that we are condemned to be free: even refusing to choose is a choice, and we cannot escape responsibility for who we become."
  who: "Jean-Paul Sartre"
  what: "philosopher"
  source: "Existentialism is a Humanism, 1946"
- text: "Angrist and Pischke argued that credible causal claims usually come from a design — an experiment, a discontinuity, a natural accident — rather than from a cleverer model."
  who: "Joshua Angrist and Jörn-Steffen Pischke"
  what: "economists"
  source: "Mostly Harmless Econometrics, 2009"
- text: "Taleb distinguished things that break under stress from things that get stronger, and argued we build too many of the first kind."
  who: "Nassim Nicholas Taleb"
  what: "essayist"
  source: "Antifragile, 2012"
- text: "Friedman and Schwartz argued that the Great Depression was deepened by the Federal Reserve allowing the money supply to collapse — a policy failure, not a market one."
  who: "Milton Friedman and Anna Schwartz"
  what: "economists"
  source: "A Monetary History of the United States, 1963"
- text: "Sagan described science as a candle in the dark, valuable less for its answers than for its way of catching its own errors."
  who: "Carl Sagan"
  what: "astronomer"
  source: "The Demon-Haunted World, 1995"
- text: "Roth turned matching theory into working systems for kidney exchange and school admission, showing that market design can create markets where money is not allowed."
  who: "Alvin Roth"
  what: "economist"
  source: "Who Gets What and Why, 2015"
- text: "Plato's cave describes prisoners who mistake shadows for reality, and the painful adjustment of anyone who turns around and sees the fire."
  who: "Plato"
  what: "philosopher"
  source: "The Republic, c. 375 BCE"
- text: "Friedman argued that inflation is always and everywhere a monetary phenomenon, and that central banks should follow steady rules rather than improvise."
  who: "Milton Friedman"
  what: "economist"
  source: "The Counter-Revolution in Monetary Theory, 1970"
- text: "Shannon showed that information can be measured, and that the measure is how much uncertainty a message removes."
  who: "Claude Shannon"
  what: "mathematician"
  source: "A Mathematical Theory of Communication, 1948"
- text: "Sen pointed out that a person may be unable to convert income into a good life — illness, disability or discrimination can break the link between money and freedom."
  who: "Amartya Sen"
  what: "economist"
  source: "Commodities and Capabilities, 1985"
- text: "Rousseau opened by observing that man is born free and is everywhere in chains, then asked what could make those chains legitimate."
  who: "Jean-Jacques Rousseau"
  what: "philosopher"
  source: "The Social Contract, 1762"
- text: "Ariely found that people will work for free or for good pay, but offering a small payment can make them do less than offering nothing at all."
  who: "Dan Ariely"
  what: "behavioural economist"
  source: "Predictably Irrational, 2008"
- text: "Popper argued that a tolerant society must not extend unlimited tolerance to those who would destroy tolerance itself."
  who: "Karl Popper"
  what: "philosopher"
  source: "The Open Society and Its Enemies, 1945"
- text: "Rosenthal and Jacobson found that telling teachers certain randomly chosen pupils were expected to bloom improved those pupils' results. Expectations can be self-fulfilling."
  who: "Robert Rosenthal and Lenore Jacobson"
  what: "psychologists"
  source: "Pygmalion in the Classroom, 1968"
- text: "Lovelock proposed that life and its environment act as one self-regulating system, a view resisted before it was partly absorbed."
  who: "James Lovelock"
  what: "scientist"
  source: "Gaia: A New Look at Life on Earth, 1979"
- text: "Tetlock tracked thousands of expert political forecasts over two decades and found that confident specialists did worse than people who held many loose ideas at once."
  who: "Philip Tetlock"
  what: "psychologist"
  source: "Expert Political Judgment, 2005"
- text: "Kant's categorical imperative asks whether you could will the rule behind your action to become a universal law."
  who: "Immanuel Kant"
  what: "philosopher"
  source: "Groundwork of the Metaphysics of Morals, 1785"
- text: "Mullainathan and Shafir argued that scarcity itself taxes the mind: being short of money or time narrows attention and crowds out other thinking."
  who: "Sendhil Mullainathan and Eldar Shafir"
  what: "economist and psychologist"
  source: "Scarcity, 2013"
- text: "Nagarjuna argued that nothing exists independently: everything is what it is only in relation to other things."
  who: "Nagarjuna"
  what: "philosopher"
  source: "Mulamadhyamakakarika, c. 150"
- text: "Samuelson showed that much of economics could be written as constrained optimisation, which unified scattered arguments and set the field's mathematical direction for decades."
  who: "Paul Samuelson"
  what: "economist"
  source: "Foundations of Economic Analysis, 1947"
- text: "Kierkegaard argued that life can only be understood backwards but must be lived forwards."
  who: "Søren Kierkegaard"
  what: "philosopher"
  source: "Journals, 1843"
- text: "Naoroji argued that Britain was draining wealth from India through remittances, salaries and pensions, and compiled the first serious estimates of Indian national income to prove it."
  who: "Dadabhai Naoroji"
  what: "economist and politician"
  source: "Poverty and Un-British Rule in India, 1901"
- text: "Parkinson observed that work expands to fill the time available for its completion."
  who: "C. Northcote Parkinson"
  what: "historian"
  source: "Parkinson's Law, 1955"
- text: "Ricardo saw that rent is not what makes corn expensive; corn being expensive is what makes land valuable. The causation runs the opposite way to the intuition."
  who: "David Ricardo"
  what: "economist"
  source: "An Essay on the Influence of a Low Price of Corn, 1815"
- text: "Lorenz found that tiny differences in starting conditions produce wildly different weather, which is why forecasts fail beyond a horizon."
  who: "Edward Lorenz"
  what: "meteorologist"
  source: "Deterministic Nonperiodic Flow, 1963"
- text: "Rodrik argued that no country has grown rich by following a single blueprint, and that the same goal often needs different policies in different places."
  who: "Dani Rodrik"
  what: "economist"
  source: "One Economics, Many Recipes, 2007"
- text: "Hobbes argued that without a common power to keep people in awe, life would be solitary, poor, nasty, brutish and short."
  who: "Thomas Hobbes"
  what: "philosopher"
  source: "Leviathan, 1651"
- text: "Ostrom documented communities that managed shared fisheries, forests and water for centuries without privatising them or handing them to the state. The tragedy of the commons is not inevitable."
  who: "Elinor Ostrom"
  what: "political economist"
  source: "Governing the Commons, 1990"
- text: "Verghese Kurien built a dairy cooperative that made producers the owners, turning India from a milk importer into the world's largest producer."
  who: "Verghese Kurien"
  what: "engineer and cooperative leader"
  source: "I Too Had a Dream, 2005"
- text: "Keynes argued that an economy can settle at high unemployment and stay there. Waiting for markets to clear was no comfort, because in the long run we are all dead."
  who: "John Maynard Keynes"
  what: "economist"
  source: "The General Theory of Employment, Interest and Money, 1936"
- text: "Darwin wrote that it is not the strongest or the most intelligent that survives, but the one most responsive to change."
  who: "Charles Darwin"
  what: "naturalist"
  source: "On the Origin of Species, 1859"
- text: "We get our dinner not because the butcher and the baker are kind, but because selling it serves them too. Smith's point was not that kindness is useless — it is that a system working only on kindness would feed almost nobody."
  who: "Adam Smith"
  what: "economist"
  source: "The Wealth of Nations, 1776"
- text: "Dewey argued that education is not preparation for life but life itself, and that we learn by doing and then reflecting."
  who: "John Dewey"
  what: "philosopher and educator"
  source: "Democracy and Education, 1916"
- text: "Nussbaum extended the capability approach into a list of central capabilities a decent society should secure, arguing that some freedoms are not tradeable against income."
  who: "Martha Nussbaum"
  what: "philosopher"
  source: "Creating Capabilities, 2011"
- text: "Mendel discovered that inheritance works in discrete units rather than by blending, and his paper sat unread for thirty-five years."
  who: "Gregor Mendel"
  what: "monk and scientist"
  source: "Experiments on Plant Hybridization, 1866"
- text: "Coase argued that if rights are clear and bargaining is cheap, the people affected by a nuisance can settle it between themselves, whoever the law happens to favour."
  who: "Ronald Coase"
  what: "economist"
  source: "The Problem of Social Cost, 1960"
- text: "Wittgenstein argued that the limits of my language mean the limits of my world."
  who: "Ludwig Wittgenstein"
  what: "philosopher"
  source: "Tractatus Logico-Philosophicus, 1921"
- text: "Simon observed that a wealth of information creates a poverty of attention. When information becomes abundant, the scarce resource is whoever is reading it."
  who: "Herbert Simon"
  what: "economist and cognitive scientist"
  source: "Designing Organizations for an Information-Rich World, 1971"
- text: "M. S. Swaminathan argued that higher yields without attention to soil, water and the smallest farmers would buy time rather than solve hunger."
  who: "M. S. Swaminathan"
  what: "agricultural scientist"
  source: "Writings on the evergreen revolution, 1990s"
- text: "Hirschman warned that arguments against reform recur in the same three shapes: it will backfire, it will change nothing, it will endanger something precious."
  who: "Albert Hirschman"
  what: "economist"
  source: "The Rhetoric of Reaction, 1991"
- text: "Thucydides reported the Athenians telling the Melians that the strong do what they can and the weak suffer what they must."
  who: "Thucydides"
  what: "historian"
  source: "History of the Peloponnesian War, c. 400 BCE"
- text: "Arrow explained why medical care resists ordinary market analysis: the buyer cannot judge the product, the seller advises on how much to buy, and the need is unpredictable."
  who: "Kenneth Arrow"
  what: "economist"
  source: "Uncertainty and the Welfare Economics of Medical Care, 1963"
- text: "Mandelbrot showed that coastlines, clouds and price charts share a roughness that ordinary geometry cannot describe."
  who: "Benoit Mandelbrot"
  what: "mathematician"
  source: "The Fractal Geometry of Nature, 1982"
- text: "Veblen noticed that some things are bought precisely because they are expensive. Consumption can be a display of standing rather than a satisfaction of need."
  who: "Thorstein Veblen"
  what: "economist and sociologist"
  source: "The Theory of the Leisure Class, 1899"
- text: "Chandra Bhan Prasad argued that markets and urban anonymity weakened caste in ways that village reform movements had not managed."
  who: "Chandra Bhan Prasad"
  what: "writer"
  source: "Writings on Dalit capitalism, 2000s"
- text: "Hayek described prices as a device for communicating information. A rising price tells millions of strangers to use less of something, without any of them needing to know why."
  who: "Friedrich Hayek"
  what: "economist"
  source: "The Use of Knowledge in Society, 1945"
- text: "Wittgenstein later argued that meaning is use: a word means what it does in the practices of the people who speak it."
  who: "Ludwig Wittgenstein"
  what: "philosopher"
  source: "Philosophical Investigations, 1953"
- text: "Acemoglu, Johnson and Robinson used the mortality rates of colonial settlers to show that where Europeans could safely settle, they built institutions that still shape incomes today."
  who: "Daron Acemoglu, Simon Johnson and James Robinson"
  what: "economists"
  source: "The Colonial Origins of Comparative Development, 2001"
- text: "Weber traced the discipline of modern capitalism partly to religious ideas about work, and worried it would end as an iron cage."
  who: "Max Weber"
  what: "sociologist"
  source: "The Protestant Ethic and the Spirit of Capitalism, 1905"
- text: "Banerjee and Duflo found that poor households often spend on festivals and television rather than more food, and that assuming this is irrational misses what else poverty takes away."
  who: "Abhijit Banerjee and Esther Duflo"
  what: "economists"
  source: "Poor Economics, 2011"
- text: "Weil argued that attention — real, unselfish attention to another person — is the rarest and purest form of generosity."
  who: "Simone Weil"
  what: "philosopher"
  source: "Gravity and Grace, 1947"
- text: "Popper argued that a theory earns scientific standing by forbidding something. A claim compatible with every possible observation explains nothing."
  who: "Karl Popper"
  what: "philosopher of science"
  source: "The Logic of Scientific Discovery, 1934"
- text: "Savitribai Phule opened schools for girls and for lower-caste children when both were considered unthinkable, and taught in them herself."
  who: "Savitribai Phule"
  what: "educator and poet"
  source: "Kavya Phule, 1854"
- text: "Sen's work on missing women showed that sex ratios in parts of Asia implied tens of millions of women who should have been alive and were not."
  who: "Amartya Sen"
  what: "economist"
  source: "More Than 100 Million Women Are Missing, 1990"
- text: "Turing proposed replacing the question of whether machines can think with a test of whether they can be told apart from a person in conversation."
  who: "Alan Turing"
  what: "mathematician"
  source: "Computing Machinery and Intelligence, 1950"
- text: "Arrow proved that no voting rule can turn individual rankings into a group ranking while meeting a short list of reasonable conditions. Collective preference is harder than it looks."
  who: "Kenneth Arrow"
  what: "economist"
  source: "Social Choice and Individual Values, 1951"
- text: "Burke argued that society is a partnership between the dead, the living and the unborn, and warned against discarding inherited arrangements quickly."
  who: "Edmund Burke"
  what: "political thinker"
  source: "Reflections on the Revolution in France, 1790"
- text: "Prebisch and Singer argued that countries exporting raw materials face slowly worsening terms of trade against countries exporting manufactures."
  who: "Raúl Prebisch and Hans Singer"
  what: "economists"
  source: "The Economic Development of Latin America, 1950"
- text: "Arendt argued that the first step towards domination is to make people believe nothing is true, since a people who believe nothing cannot judge."
  who: "Hannah Arendt"
  what: "political theorist"
  source: "The Origins of Totalitarianism, 1951"
- text: "Akerlof showed that if buyers cannot tell good used cars from bad ones, sellers of good cars withdraw, and the market can collapse even though gains from trade exist."
  who: "George Akerlof"
  what: "economist"
  source: "The Market for Lemons, 1970"
- text: "Foot's trolley problem asks why diverting a runaway tram to kill one instead of five feels different from pushing one person to save five."
  who: "Philippa Foot"
  what: "philosopher"
  source: "The Problem of Abortion and the Doctrine of the Double Effect, 1967"
- text: "Goodhart observed that when a measure becomes a target, it stops being a good measure. People optimise the number rather than the thing it stood for."
  who: "Charles Goodhart"
  what: "economist"
  source: "Problems of Monetary Management, 1975"
- text: "Basava argued that work itself is worship, and built a movement rejecting caste distinctions on that principle."
  who: "Basava"
  what: "philosopher and reformer"
  source: "Vachanas, 12th century"
- text: "Sen observed that no substantial famine has occurred in a functioning democracy with a free press. Governments that can be voted out act before people starve."
  who: "Amartya Sen"
  what: "economist"
  source: "Development as Freedom, 1999"
- text: "Sraffa reconstructed classical value theory without marginal utility, showing that an alternative framework was internally coherent."
  who: "Piero Sraffa"
  what: "economist"
  source: "Production of Commodities by Means of Commodities, 1960"
- text: "Smith warned that people in the same trade rarely meet without the conversation turning to how to raise prices against the public. He trusted competition more than he trusted businessmen."
  who: "Adam Smith"
  what: "economist"
  source: "The Wealth of Nations, 1776"
- text: "Deming argued that most defects come from the system people work in rather than from the people, and that blaming workers misses the cause."
  who: "W. Edwards Deming"
  what: "statistician"
  source: "Out of the Crisis, 1982"
- text: "Gandhi argued that the means and the ends cannot be separated, because the means are the ends in the making."
  who: "Mohandas Gandhi"
  what: "political leader"
  source: "Hind Swaraj, 1909"
- text: "Ericsson found that expert performance comes from deliberate practice at the edge of ability, not from hours logged comfortably."
  who: "K. Anders Ericsson"
  what: "psychologist"
  source: "The Role of Deliberate Practice, 1993"
- text: "Hardin argued that a pasture open to all would be destroyed because each herdsman gains the whole value of an extra animal while sharing the cost of overgrazing."
  who: "Garrett Hardin"
  what: "ecologist"
  source: "The Tragedy of the Commons, 1968"
- text: "Galileo argued that the book of nature is written in the language of mathematics, and that observation outranks authority."
  who: "Galileo Galilei"
  what: "astronomer"
  source: "The Assayer, 1623"
- text: "Russell observed that the trouble with the world is that the stupid are confident while the intelligent are full of doubt."
  who: "Bertrand Russell"
  what: "philosopher"
  source: "The Triumph of Stupidity, 1933"
- text: "Postman warned that a society can be ruined by what it loves as easily as by what it fears."
  who: "Neil Postman"
  what: "media theorist"
  source: "Amusing Ourselves to Death, 1985"
- text: "Orwell argued that sloppy language makes sloppy thought possible, and that political writing often exists to make lies sound respectable."
  who: "George Orwell"
  what: "writer"
  source: "Politics and the English Language, 1946"
- text: "Beauvoir argued that one is not born a woman but becomes one, and that what is called nature is largely what society has made."
  who: "Simone de Beauvoir"
  what: "philosopher"
  source: "The Second Sex, 1949"
- text: "Madrian and Shea found that changing a pension scheme's default from opt-in to opt-out raised participation dramatically, without changing anyone's options."
  who: "Brigitte Madrian and Dennis Shea"
  what: "economists"
  source: "The Power of Suggestion, 2001"
- text: "Ramanujan arrived at results in number theory by routes no one has fully reconstructed, many proved correct long after his death."
  who: "Srinivasa Ramanujan"
  what: "mathematician"
  source: "Notebooks, 1914 onwards"
- text: "Coase asked why firms exist at all if markets are efficient, and answered that using the market has costs — finding, bargaining, enforcing — which a firm avoids by giving orders instead."
  who: "Ronald Coase"
  what: "economist"
  source: "The Nature of the Firm, 1937"
- text: "Ela Bhatt organised self-employed women in the informal economy into a union, arguing that invisible work is still work."
  who: "Ela Bhatt"
  what: "labour organiser"
  source: "We Are Poor but So Many, 2006"
