# ---------------------------------------------------------------
# Thought of the day.
#
# One is shown each day, picked by the date. Nothing to schedule.
#
# These are IDEAS RESTATED IN PLAIN LANGUAGE, not quotations.
# That is deliberate. A misattributed quote is the fastest way an
# economics page loses its reputation, and Smith and Keynes are the
# two most misquoted economists there have ever been. Describing
# what someone argued, and naming the work, cannot be a misquote.
#
# AN ENTRY WITH NO source: IS SILENTLY DROPPED. You cannot
# accidentally publish an unsourced claim under your own name.
#
# COPY THIS SHAPE. Two spaces before every line after the first.
#
#   - text: "The idea, in plain language. Two or three sentences."
#     who: "Elinor Ostrom"
#     what: "political economist"
#     source: "Governing the Commons, 1990"
# ---------------------------------------------------------------

- text: "Hotelling showed that two sellers free to position themselves tend to end up next to each other in the middle, which also explains political platforms."
  who: "Harold Hotelling"
  what: "economist"
  source: "Stability in Competition, 1929"
- text: "Euler solved the puzzle of Königsberg's seven bridges by ignoring distance entirely and keeping only the connections, founding graph theory."
  who: "Leonhard Euler"
  what: "mathematician"
  source: "Solutio problematis ad geometriam situs pertinentis, 1736"
- text: "Keynes argued that an economy can settle at high unemployment and stay there. Waiting for markets to clear was no comfort, because in the long run we are all dead."
  who: "John Maynard Keynes"
  what: "economist"
  source: "The General Theory of Employment, Interest and Money, 1936"
- text: "Shannon showed that information can be measured, and that the measure is how much uncertainty a message removes."
  who: "Claude Shannon"
  what: "mathematician"
  source: "A Mathematical Theory of Communication, 1948"
- text: "Rodrik argued that no country has grown rich by following a single blueprint, and that the same goal often needs different policies in different places."
  who: "Dani Rodrik"
  what: "economist"
  source: "One Economics, Many Recipes, 2007"
- text: "Gödel proved that any consistent system rich enough for arithmetic contains true statements it cannot prove."
  who: "Kurt Gödel"
  what: "logician"
  source: "On Formally Undecidable Propositions, 1931"
- text: "Goodhart observed that when a measure becomes a target, it stops being a good measure. People optimise the number rather than the thing it stood for."
  who: "Charles Goodhart"
  what: "economist"
  source: "Problems of Monetary Management, 1975"
- text: "Boole turned logic into algebra, and his true-and-false arithmetic became the basis of every digital circuit."
  who: "George Boole"
  what: "mathematician"
  source: "An Investigation of the Laws of Thought, 1854"
- text: "Hayek's case against central planning was about knowledge, not motives: the information needed to run an economy exists in scattered fragments in millions of heads, and no office can gather it."
  who: "Friedrich Hayek"
  what: "economist"
  source: "The Use of Knowledge in Society, 1945"
- text: "Feynman observed that for a successful technology, reality must take precedence over public relations, because nature cannot be fooled."
  who: "Richard Feynman"
  what: "physicist"
  source: "Appendix to the Rogers Commission Report, 1986"
- text: "Akerlof showed that if buyers cannot tell good used cars from bad ones, sellers of good cars withdraw, and the market can collapse even though gains from trade exist."
  who: "George Akerlof"
  what: "economist"
  source: "The Market for Lemons, 1970"
- text: "Fisher introduced randomisation so that the only systematic difference between two groups is the treatment itself — the logic behind every controlled trial since."
  who: "Ronald Fisher"
  what: "statistician"
  source: "The Design of Experiments, 1935"
- text: "Duflo argued that economists should be more like plumbers: concerned with how a policy actually works in the pipes, not only whether the theory is sound."
  who: "Esther Duflo"
  what: "economist"
  source: "The Economist as Plumber, 2017"
- text: "Bhaskara II described a method for instantaneous rates of change centuries before calculus was formalised in Europe."
  who: "Bhaskara II"
  what: "mathematician"
  source: "Siddhanta Shiromani, 1150"
- text: "Ricardo saw that rent is not what makes corn expensive; corn being expensive is what makes land valuable. The causation runs the opposite way to the intuition."
  who: "David Ricardo"
  what: "economist"
  source: "An Essay on the Influence of a Low Price of Corn, 1815"
- text: "McClintock discovered that genes can move within a genome, a finding dismissed for decades before it won her a Nobel Prize."
  who: "Barbara McClintock"
  what: "geneticist"
  source: "The Origin and Behavior of Mutable Loci in Maize, 1950"
- text: "Ambedkar argued that political democracy cannot survive on top of social inequality, and that a constitution is only as good as the society willing to live by it."
  who: "B. R. Ambedkar"
  what: "jurist and economist"
  source: "Final speech to the Constituent Assembly, 1949"
- text: "Gould and Eldredge argued that evolution proceeds in bursts separated by long stability, not at one steady pace."
  who: "Stephen Jay Gould and Niles Eldredge"
  what: "palaeontologists"
  source: "Punctuated Equilibria, 1972"
- text: "Lewis described development as the movement of surplus labour from a traditional sector into a modern one, with wages held down until the surplus is exhausted."
  who: "W. Arthur Lewis"
  what: "economist"
  source: "Economic Development with Unlimited Supplies of Labour, 1954"
- text: "Simpson's paradox is the discovery that a pattern can hold within every group and reverse when the groups are added together. Aggregation can lie."
  who: "Edward Simpson"
  what: "statistician"
  source: "The Interpretation of Interaction in Contingency Tables, 1951"
- text: "Heckman's work on early childhood found that the return on investment in young children is higher than on almost any later intervention."
  who: "James Heckman"
  what: "economist"
  source: "Skill Formation and the Economics of Investing in Disadvantaged Children, 2006"
- text: "Darwin argued that complex design can arise without a designer, through variation and the differential survival it produces."
  who: "Charles Darwin"
  what: "naturalist"
  source: "On the Origin of Species, 1859"
- text: "Deaton warned that aid can weaken the link between a government and its citizens, because a state funded from abroad needs its people less."
  who: "Angus Deaton"
  what: "economist"
  source: "The Great Escape, 2013"
- text: "Pascal's wager reframes belief as a decision under uncertainty rather than a question of evidence — an early piece of decision theory."
  who: "Blaise Pascal"
  what: "mathematician"
  source: "Pensées, 1670"
- text: "Hirschman observed that development projects succeed partly because planners underestimate the difficulties; had they known, they would not have begun."
  who: "Albert Hirschman"
  what: "economist"
  source: "Development Projects Observed, 1967"
- text: "Hardy wrote that there is no permanent place in the world for ugly mathematics, and defended the beauty of work with no use."
  who: "G. H. Hardy"
  what: "mathematician"
  source: "A Mathematician's Apology, 1940"
- text: "Mill argued that the laws of production are fixed by nature, but the laws of distribution are made by people. How output is shared is a choice a society makes, not a fact it discovers."
  who: "John Stuart Mill"
  what: "philosopher and economist"
  source: "Principles of Political Economy, 1848"
- text: "Pasteur observed that in the field of observation, chance favours only the prepared mind."
  who: "Louis Pasteur"
  what: "chemist"
  source: "Lecture at the University of Lille, 1854"
- text: "Keynes warned the victors at Versailles that an economic settlement designed to punish Germany would not hold. He resigned from the delegation and published the argument."
  who: "John Maynard Keynes"
  what: "economist"
  source: "The Economic Consequences of the Peace, 1919"
- text: "Lavoisier showed that matter is neither created nor destroyed in a reaction, turning chemistry into a science of measurement."
  who: "Antoine Lavoisier"
  what: "chemist"
  source: "Elementary Treatise on Chemistry, 1789"
- text: "Debreu and Arrow proved that a set of prices balancing every market at once can exist, and made explicit how demanding the conditions are."
  who: "Gerard Debreu and Kenneth Arrow"
  what: "economists"
  source: "Existence of an Equilibrium for a Competitive Economy, 1954"
- text: "Gale and Shapley designed an algorithm that matches two sides — students and schools, doctors and hospitals — so that no pair would rather abandon their assignment for each other."
  who: "David Gale and Lloyd Shapley"
  what: "mathematicians"
  source: "College Admissions and the Stability of Marriage, 1962"
- text: "Fehr and Gächter found that people will pay out of their own pocket to punish free riders, even when they will never meet them again."
  who: "Ernst Fehr and Simon Gächter"
  what: "economists"
  source: "Altruistic Punishment in Humans, 2002"
- text: "Trivers explained how helping unrelated individuals can evolve, provided the favour is likely to be returned."
  who: "Robert Trivers"
  what: "biologist"
  source: "The Evolution of Reciprocal Altruism, 1971"
- text: "Solow found that most growth in output per worker could not be explained by more machines or more workers. The unexplained remainder — technology — turned out to be the main story."
  who: "Robert Solow"
  what: "economist"
  source: "Technical Change and the Aggregate Production Function, 1957"
- text: "Marie Curie isolated radium by processing tonnes of ore by hand, and declined to patent the process."
  who: "Marie Curie"
  what: "physicist and chemist"
  source: "Research on Radioactive Substances, 1903"
- text: "Easterlin found that within a country richer people report more happiness, but that a country growing richer over decades does not show the same rise."
  who: "Richard Easterlin"
  what: "economist"
  source: "Does Economic Growth Improve the Human Lot?, 1974"
- text: "Lise Meitner worked out the physics of nuclear fission while in exile, and was left off the prize awarded for it."
  who: "Lise Meitner"
  what: "physicist"
  source: "Disintegration of Uranium by Neutrons, 1939"
- text: "Spence, Akerlof and Stiglitz together established that information is rarely shared equally between the two sides of a transaction, and that this changes almost everything."
  who: "George Akerlof, Michael Spence and Joseph Stiglitz"
  what: "economists"
  source: "Nobel Prize lectures, 2001"
- text: "Franklin's X-ray image of DNA provided the evidence for the double helix, and her contribution went largely uncredited in her lifetime."
  who: "Rosalind Franklin"
  what: "chemist"
  source: "X-ray studies of DNA, 1952"
- text: "Diamond and Dybvig showed that a bank run can be entirely rational: if you expect others to withdraw, withdrawing first is your best move."
  who: "Douglas Diamond and Philip Dybvig"
  what: "economists"
  source: "Bank Runs, Deposit Insurance, and Liquidity, 1983"
- text: "Einstein held that imagination is more important than knowledge, because knowledge is limited to what we already have."
  who: "Albert Einstein"
  what: "physicist"
  source: "Interview in The Saturday Evening Post, 1929"
- text: "Spence argued that education can be valuable to an employer even if it taught nothing, so long as it is harder for a weak candidate to obtain than a strong one."
  who: "Michael Spence"
  what: "economist"
  source: "Job Market Signaling, 1973"
- text: "Nussbaum argued that literature trains the moral imagination by making us inhabit lives unlike our own."
  who: "Martha Nussbaum"
  what: "philosopher"
  source: "Poetic Justice, 1995"
- text: "Stiglitz argued that markets left alone will not produce an efficient outcome when information is imperfect, which is nearly always."
  who: "Joseph Stiglitz"
  what: "economist"
  source: "Externalities in Economies with Imperfect Information, 1986"
- text: "Hubble found that distant galaxies are moving away from us faster the further off they are, which implied an expanding universe."
  who: "Edwin Hubble"
  what: "astronomer"
  source: "A Relation Between Distance and Radial Velocity, 1929"
- text: "Baumol explained why a string quartet costs more every decade: it still takes four players and the same minutes, while wages rise with productivity elsewhere."
  who: "William Baumol"
  what: "economist"
  source: "Performing Arts: The Economic Dilemma, 1966"
- text: "Berlin distinguished hedgehogs, who know one big thing, from foxes, who know many things, and thought the distinction ran through all thought."
  who: "Isaiah Berlin"
  what: "philosopher"
  source: "The Hedgehog and the Fox, 1953"
- text: "Hirschman described two responses to decline: leave, or speak up. Which one people choose depends on loyalty, and a firm that makes leaving easy may never hear the complaint."
  who: "Albert Hirschman"
  what: "economist"
  source: "Exit, Voice, and Loyalty, 1970"
- text: "Faraday showed that a moving magnet produces a current, the discovery on which every power station still runs."
  who: "Michael Faraday"
  what: "physicist"
  source: "Experimental Researches in Electricity, 1831"
- text: "Boulding observed that anyone who believes exponential growth can go on forever in a finite world is either a madman or an economist."
  who: "Kenneth Boulding"
  what: "economist"
  source: "Testimony to the US Congress, 1973"
- text: "Long before the book on markets, Smith argued that people judge their own conduct by imagining how an impartial observer would see it. The man who wrote about self-interest began with sympathy."
  who: "Adam Smith"
  what: "moral philosopher"
  source: "The Theory of Moral Sentiments, 1759"
- text: "Williamson built on Coase to ask when a firm should buy something and when it should make it, and answered: when the asset is so specialised that each side could hold the other hostage."
  who: "Oliver Williamson"
  what: "economist"
  source: "Markets and Hierarchies, 1975"
- text: "Deming argued that most defects come from the system people work in rather than from the people, and that blaming workers misses the cause."
  who: "W. Edwards Deming"
  what: "statistician"
  source: "Out of the Crisis, 1982"
- text: "Kalecki argued that full employment would be resisted not because it is impossible but because it shifts power towards workers."
  who: "Michał Kalecki"
  what: "economist"
  source: "Political Aspects of Full Employment, 1943"
- text: "Tukey argued that an approximate answer to the right question is worth far more than an exact answer to the wrong one."
  who: "John Tukey"
  what: "statistician"
  source: "The Future of Data Analysis, 1962"
- text: "Hayek argued that civilisation rests on our using more knowledge than any individual can possess, through institutions nobody designed."
  who: "Friedrich Hayek"
  what: "economist"
  source: "The Fatal Conceit, 1988"
- text: "Austin showed that some sentences do not describe the world but change it: saying I promise is the act of promising."
  who: "J. L. Austin"
  what: "philosopher"
  source: "How to Do Things with Words, 1962"
- text: "Leamer complained that econometricians try dozens of specifications and report the one they like, and asked his colleagues to take the con out of econometrics."
  who: "Edward Leamer"
  what: "economist"
  source: "Let's Take the Con Out of Econometrics, 1983"
- text: "E. O. Wilson argued that studying ants and studying societies are closer than either field wanted to admit."
  who: "E. O. Wilson"
  what: "biologist"
  source: "Sociobiology, 1975"
- text: "Sen argued that the idea of a single perfectly just society is less useful than comparing which of two available arrangements is less unjust."
  who: "Amartya Sen"
  what: "economist"
  source: "The Idea of Justice, 2009"
- text: "Epicurus argued that most fear of death is confused: where death is, we are not, and where we are, death is not."
  who: "Epicurus"
  what: "philosopher"
  source: "Letter to Menoeceus, c. 300 BCE"
- text: "Stiglitz and Rothschild showed that insurers who cannot tell safe customers from risky ones may offer deliberately limited cover, so that customers sort themselves."
  who: "Joseph Stiglitz and Michael Rothschild"
  what: "economists"
  source: "Equilibrium in Competitive Insurance Markets, 1976"
- text: "Wiener argued that control and communication follow the same laws in animals and machines, founding the study of feedback."
  who: "Norbert Wiener"
  what: "mathematician"
  source: "Cybernetics, 1948"
- text: "Romer argued that ideas differ from objects because they can be used by everyone at once, which makes sustained growth possible."
  who: "Paul Romer"
  what: "economist"
  source: "Endogenous Technological Change, 1990"
- text: "Sartre argued that we are condemned to be free: even refusing to choose is a choice, and we cannot escape responsibility for who we become."
  who: "Jean-Paul Sartre"
  what: "philosopher"
  source: "Existentialism is a Humanism, 1946"
- text: "Mises argued that without market prices a planner has no way of knowing whether a decision used resources well."
  who: "Ludwig von Mises"
  what: "economist"
  source: "Economic Calculation in the Socialist Commonwealth, 1920"
- text: "Leibniz dreamed of a universal notation in which disputes could be settled by saying: let us calculate."
  who: "Gottfried Wilhelm Leibniz"
  what: "philosopher and mathematician"
  source: "The Art of Discovery, 1685"
- text: "Böhm-Bawerk argued that interest exists because people prefer goods now to the same goods later."
  who: "Eugen von Böhm-Bawerk"
  what: "economist"
  source: "Capital and Interest, 1884"
- text: "Hegel argued that history advances through conflict, with each position generating its own opposition and a resolution containing both."
  who: "G. W. F. Hegel"
  what: "philosopher"
  source: "Phenomenology of Spirit, 1807"
- text: "Kremer's O-ring theory explains why small quality differences compound: in a chain of tasks where any failure ruins the product, skilled workers cluster together."
  who: "Michael Kremer"
  what: "economist"
  source: "The O-Ring Theory of Economic Development, 1993"
- text: "Popper argued that a theory earns scientific standing by forbidding something. A claim compatible with every possible observation explains nothing."
  who: "Karl Popper"
  what: "philosopher of science"
  source: "The Logic of Scientific Discovery, 1934"
- text: "Malthus feared that population grows faster than food, so misery would always return. He was wrong about the next two centuries, and the reason he was wrong — sustained technical progress — is itself the central fact of modern economics."
  who: "Thomas Robert Malthus"
  what: "economist"
  source: "An Essay on the Principle of Population, 1798"
- text: "Newton showed that the same law governs an apple falling and the moon staying in orbit — one rule for the heavens and the earth."
  who: "Isaac Newton"
  what: "physicist"
  source: "Principia Mathematica, 1687"
- text: "Keynes thought investment depends partly on animal spirits — a spontaneous urge to act rather than a calculation. Confidence is an economic variable, not a mood outside the model."
  who: "John Maynard Keynes"
  what: "economist"
  source: "The General Theory of Employment, Interest and Money, 1936"
- text: "Aristotle argued that virtue is a habit, not a feeling: we become just by doing just acts, and brave by doing brave ones."
  who: "Aristotle"
  what: "philosopher"
  source: "Nicomachean Ethics, c. 340 BCE"
- text: "Hart argued that contracts are always incomplete, so what matters is who decides when something unforeseen happens."
  who: "Oliver Hart"
  what: "economist"
  source: "Firms, Contracts, and Financial Structure, 1995"
- text: "Darwin wrote that it is not the strongest or the most intelligent that survives, but the one most responsive to change."
  who: "Charles Darwin"
  what: "naturalist"
  source: "On the Origin of Species, 1859"
- text: "Jevons argued that value depends on the usefulness of the last unit consumed, not on the labour that produced it."
  who: "William Stanley Jevons"
  what: "economist"
  source: "The Theory of Political Economy, 1871"
- text: "Foucault argued that modern power works less by punishing bodies than by watching them, until people police themselves."
  who: "Michel Foucault"
  what: "philosopher"
  source: "Discipline and Punish, 1975"
- text: "Menger argued that value is not in things but in the judgement of the person who wants them."
  who: "Carl Menger"
  what: "economist"
  source: "Principles of Economics, 1871"
- text: "Erdős treated mathematics as a collective enterprise, publishing with more than five hundred collaborators and owning almost nothing."
  who: "Paul Erdős"
  what: "mathematician"
  source: "Collected papers, 1930s onwards"
- text: "Friedman argued that inflation is always and everywhere a monetary phenomenon, and that central banks should follow steady rules rather than improvise."
  who: "Milton Friedman"
  what: "economist"
  source: "The Counter-Revolution in Monetary Theory, 1970"
- text: "Bostrom argued that an intelligent system pursuing a badly specified goal is dangerous precisely because it is competent."
  who: "Nick Bostrom"
  what: "philosopher"
  source: "Superintelligence, 2014"
- text: "Walras described an economy as a system of simultaneous equations, asking whether prices exist that clear every market at once."
  who: "Léon Walras"
  what: "economist"
  source: "Elements of Pure Economics, 1874"
- text: "Planck observed that science advances one funeral at a time, as a new generation grows up with the new idea."
  who: "Max Planck"
  what: "physicist"
  source: "Scientific Autobiography, 1948"
- text: "Minsky argued that stability breeds instability: a long calm persuades lenders and borrowers to take risks that make the next crisis worse."
  who: "Hyman Minsky"
  what: "economist"
  source: "Stabilizing an Unstable Economy, 1986"
- text: "Vikram Sarabhai argued that a poor country needed space technology not for prestige but to solve problems of communication and weather."
  who: "Vikram Sarabhai"
  what: "physicist"
  source: "Statement on the Indian space programme, 1969"
- text: "Marx saw capitalism as revolutionary rather than static: it constantly tears up its own methods, relations and certainties. Even his critics borrowed the observation."
  who: "Karl Marx"
  what: "economist and philosopher"
  source: "The Communist Manifesto, 1848"
- text: "Descartes tried doubting everything he could, and found one thing he could not doubt: that he was doubting."
  who: "René Descartes"
  what: "philosopher"
  source: "Meditations on First Philosophy, 1641"
- text: "Jevons observed that making the use of a resource more efficient can increase total consumption rather than reduce it."
  who: "William Stanley Jevons"
  what: "economist"
  source: "The Coal Question, 1865"
- text: "Foot's trolley problem asks why diverting a runaway tram to kill one instead of five feels different from pushing one person to save five."
  who: "Philippa Foot"
  what: "philosopher"
  source: "The Problem of Abortion and the Doctrine of the Double Effect, 1967"
- text: "Piketty assembled two centuries of tax records and argued that when returns on wealth exceed growth, inherited fortunes pull ahead of earned income."
  who: "Thomas Piketty"
  what: "economist"
  source: "Capital in the Twenty-First Century, 2013"
- text: "Planck found that energy comes in packets rather than a continuous flow, a result he resisted himself for years."
  who: "Max Planck"
  what: "physicist"
  source: "On the Law of Distribution of Energy, 1900"
- text: "Ricardo showed that two countries both gain from trade even when one is better at making everything. What matters is not who is better, but who gives up less to produce a thing."
  who: "David Ricardo"
  what: "economist"
  source: "On the Principles of Political Economy and Taxation, 1817"
- text: "Heisenberg showed that position and momentum cannot both be known precisely: the limit is in nature, not in our instruments."
  who: "Werner Heisenberg"
  what: "physicist"
  source: "On the Perceptual Content of Quantum Theoretical Kinematics, 1927"
- text: "Coase remarked that if you torture the data long enough, it will confess to anything."
  who: "Ronald Coase"
  what: "economist"
  source: "How Should Economists Choose?, 1982"
- text: "Kant insisted that people must be treated as ends in themselves and never merely as means to someone else's purpose."
  who: "Immanuel Kant"
  what: "philosopher"
  source: "Groundwork of the Metaphysics of Morals, 1785"
- text: "Chetty used tax records to show that the neighbourhood a child grows up in affects their adult income, and by how much."
  who: "Raj Chetty"
  what: "economist"
  source: "Where is the Land of Opportunity?, 2014"
- text: "Chalmers separated the easy problems of explaining mental functions from the hard problem of why any of it is experienced at all."
  who: "David Chalmers"
  what: "philosopher"
  source: "Facing Up to the Problem of Consciousness, 1995"
- text: "Weitzman argued that the small chance of catastrophic warming, not the expected case, should dominate the economics of climate policy."
  who: "Martin Weitzman"
  what: "economist"
  source: "On Modeling and Interpreting the Economics of Catastrophic Climate Change, 2009"
- text: "Mandelbrot showed that coastlines, clouds and price charts share a roughness that ordinary geometry cannot describe."
  who: "Benoit Mandelbrot"
  what: "mathematician"
  source: "The Fractal Geometry of Nature, 1982"
- text: "Nordhaus built the first integrated models of climate and the economy, making the cost of delay something that could be argued about numerically."
  who: "William Nordhaus"
  what: "economist"
  source: "Managing the Global Commons, 1994"
- text: "MacIntyre argued that moral debate in modern societies is interminable because the fragments of older traditions no longer fit together."
  who: "Alasdair MacIntyre"
  what: "philosopher"
  source: "After Virtue, 1981"
- text: "Marshall insisted that both supply and demand set price, the way both blades of a pair of scissors do the cutting. Arguing about which one matters misses how they work."
  who: "Alfred Marshall"
  what: "economist"
  source: "Principles of Economics, 1890"
- text: "Turing proposed replacing the question of whether machines can think with a test of whether they can be told apart from a person in conversation."
  who: "Alan Turing"
  what: "mathematician"
  source: "Computing Machinery and Intelligence, 1950"
- text: "Wicksell distinguished the interest rate banks charge from the rate that would keep the economy balanced, and argued that inflation comes from the gap between the two."
  who: "Knut Wicksell"
  what: "economist"
  source: "Interest and Prices, 1898"
- text: "Semmelweis found that doctors washing their hands between the morgue and the delivery ward saved lives, and was rejected by his profession for saying so."
  who: "Ignaz Semmelweis"
  what: "physician"
  source: "The Etiology of Childbed Fever, 1861"
- text: "Olson pointed out that a large group with a shared interest often fails to act on it, because each member gains little from contributing and cannot be excluded from the benefit."
  who: "Mancur Olson"
  what: "economist"
  source: "The Logic of Collective Action, 1965"
- text: "Bacon argued that knowledge should be built from careful observation upward, not deduced from ancient texts downward."
  who: "Francis Bacon"
  what: "philosopher of science"
  source: "Novum Organum, 1620"
- text: "Ambedkar's doctoral work analysed how the rupee's exchange rate arrangements served colonial interests, an economic argument made years before his constitutional work."
  who: "B. R. Ambedkar"
  what: "economist"
  source: "The Problem of the Rupee, 1923"
- text: "Rutherford's foil experiment showed that atoms are almost entirely empty space with a tiny dense nucleus, which he said was as surprising as a shell bouncing off tissue paper."
  who: "Ernest Rutherford"
  what: "physicist"
  source: "The Scattering of Alpha and Beta Particles, 1911"
- text: "Holmström showed that paying for measured results distorts effort towards whatever is measured, and away from what is not."
  who: "Bengt Holmström"
  what: "economist"
  source: "Multitask Principal-Agent Analyses, 1991"
